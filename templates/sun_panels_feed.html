<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Солнечные панели</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/sun_panels_style.css">
</head>

<body>

    <div class="app-wrapper">

        <div class="video-container">
            <video autoplay loop muted playsinline>
                <source src="{{ service.video_url or '../assets/resoursec/video/background1.mp4' }}" type="video/mp4">
            </video>
        </div>

        <div class="content-overlay">

            <div class="icon-stack">

                <button class="icon-btn like-btn" type="button" aria-label="Поставить лайк">
                    <svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    <span class="like-count">{{ likes_count }}</span>
                </button>

                <a class="icon-btn next-btn" href="/sun_panels_feed/{{ service.id }}?next=true"
                    aria-label="Следующая карточка">
                    <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
                    </svg>
                </a>

                <div class="icon-btn info-btn" aria-label="КПД">
                    <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" />
                    </svg>
                    <span class="info-value">{{ service.kpd }}%</span>
                </div>

                <div class="icon-btn info-btn" aria-label="Цена за м²">
                    <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 1l-9 4.5v13L12 23l9-4.5v-13L12 1zm0 2.18l6.9 3.45L12 10.09 5.1 6.63 12 3.18zM5 8.34l6 3v8.32l-6-3V8.34zm8 11.32v-8.32l6-3v8.32l-6 3z" />
                    </svg>
                    <span class="info-value">{{ service.price }} ₽/м²</span>
                </div>

            </div>

            <div class="info-card">
                <h2>{{ service.title }}</h2>
                <p class="desc">
                    {% if more %}
                    {{ service.description }}
                    <a href="/sun_panels_feed/{{ service.id }}?less=true" class="more-link">Меньше</a>
                    {% else %}
                    {{ service.description[:80] }}...
                    {% endif %}
                    {% if not more %}
                    <a href="/sun_panels_feed/{{ service.id }}?more=true" class="more-link">Ещё</a>
                    {% endif %}
                </p>
            </div>

        </div>

        <nav class="bottom-nav">
            <a href="/" class="nav-item active">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                </svg>
                <span>Лента</span>
            </a>
            <a href="/sun_panels_add" class="nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                <span>Добавить</span>
            </a>
            <a href="/sun_panels_cards" class="nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M3 3h8v8H3zm0 10h8v8H3zM13 3h8v8h-8zm0 10h8v8h-8z" />
                </svg>
                <span>Плитка</span>
            </a>
        </nav>

    </div>

</body>

</html>
