<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Черновик — Vibes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/sun_panels_style.css">
</head>

<body>

    <div class="app-wrapper">

        <header class="page-header">
            <h1>{% if draft %}Публикация панели{% else %}Черновик панели{% endif %}</h1>
        </header>

        <main class="form-scroll">

            {% if draft %}
            {# ============ Есть черновик — форма публикации ============ #}
            <form action="/sun_panels_draft/publish" method="POST" enctype="multipart/form-data" class="form-inner">

                <!-- Изображение — статичная картинка-заглушка -->
                <div class="form-group">
                    <label>Изображение</label>
                    <div class="media-preview">
                        <img src="/static/panel1.jpg" alt="Изображение панели" class="media-preview-img">
                    </div>
                </div>

                <!-- Видео — статичная картинка-заглушка -->
                <div class="form-group">
                    <label>Видео</label>
                    <div class="media-preview">
                        <img src="/static/panel1.jpg" alt="Превью видео панели" class="media-preview-img">
                        <span class="media-preview-badge" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Тип панели (readonly, задан при создании) -->
                <div class="form-group">
                    <label for="panel-type">Тип панели</label>
                    <input type="text" id="panel-type" name="title" value="{{ draft.title }}">
                </div>

                <!-- Описание -->
                <div class="form-group">
                    <label for="panel-desc">Описание</label>
                    <textarea id="panel-desc" name="description" rows="3"
                        placeholder="Краткое описание">{{ draft.description or '' }}</textarea>
                </div>

                <!-- КПД -->
                <div class="form-group">
                    <label for="panel-eff">КПД (%)</label>
                    <input type="number" id="panel-eff" name="kpd" value="{{ draft.kpd or '' }}" placeholder="22"
                        min="0" max="100" step="1" required style="height: 30px;">
                </div>

                <!-- Цена за м² -->
                <div class="form-group">
                    <label for="panel-price">Цена (₽/м²)</label>
                    <input id="panel-price" name="price" value="{{ draft.price or '' }}"
                        placeholder="5000" required style="height: 30px;">
                </div>

                <button type="submit" class="next-btn">Опубликовать</button>
            </form>

            {% else %}
            {# ============ Черновика нет — форма создания ============ #}
            <form action="/sun_panels_draft" method="POST" enctype="multipart/form-data" class="form-inner">

                <!-- Изображение — кликабельное поле загрузки -->
                <div class="form-group">
                    <label>Изображение</label>
                    <label class="upload-box" for="image-input">
                        <input type="file" id="image-input" name="image" accept="image/*" class="file-input">
                        <span class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                            </svg>
                        </span>
                        <span class="file-name" data-placeholder="Загрузить изображение">
                            Загрузить изображение
                        </span>
                    </label>
                </div>

                <!-- Видео — кликабельное поле загрузки -->
                <div class="form-group">
                    <label>Видео</label>
                    <label class="upload-box" for="video-input">
                        <input type="file" id="video-input" name="video" accept="video/*" class="file-input">
                        <span class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                            </svg>
                        </span>
                        <span class="file-name" data-placeholder="Загрузить видео">
                            Загрузить видео
                        </span>
                    </label>
                </div>

                <!-- Тип панели -->
                <div class="form-group">
                    <label for="panel-type">Тип панели</label>
                    <input type="text" id="panel-type" name="title" placeholder="Монохроматическая панель" required>
                </div>

                <button type="submit" class="next-btn">Далее</button>
            </form>
            {% endif %}

        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" />
                </svg>
                <span>Лента</span>
            </a>
            <a href="/sun_panels_add" class="nav-item active">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                <span>Добавить</span>
            </a>
            <a href="/sun_panels_cards" class="nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M3 3h8v8H3zm0 10h8v8H3zM13 3h8v8h-8zm0 10h8v8h-8z" />
                </svg>
                <span>Плитка</span>
            </a>
        </nav>

    </div>

</body>

</html>
